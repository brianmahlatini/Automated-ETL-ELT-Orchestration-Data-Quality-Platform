apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etl-api
  template:
    metadata:
      labels:
        app: etl-api
    spec:
      containers:
        - name: api
          image: ghcr.io/brianmahlatini/etl-quality-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: etl-api
spec:
  selector:
    app: etl-api
  ports:
    - port: 8000
      targetPort: 8000
