apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etl-frontend
  template:
    metadata:
      labels:
        app: etl-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/brianmahlatini/etl-dashboard:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: etl-frontend
spec:
  type: LoadBalancer
  selector:
    app: etl-frontend
  ports:
    - port: 80
      targetPort: 5173
