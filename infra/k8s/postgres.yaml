apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl-postgres
  template:
    metadata:
      labels:
        app: etl-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: etl
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etl-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: lakehouse
---
apiVersion: v1
kind: Service
metadata:
  name: etl-postgres
spec:
  selector:
    app: etl-postgres
  ports:
    - port: 5432
      targetPort: 5432
